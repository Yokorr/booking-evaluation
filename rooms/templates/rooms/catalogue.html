<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room catalogue</title>
</head>
<body>
    <main>
        <h1>Room catalogue</h1>
        {% for room in rooms %}
            <article class="room-card">
                <h2>{{ room.name }}</h2>
                <p>Code: {{ room.code }}</p>
                <p>Capacity: {{ room.capacity }} seats ({{ room.capacity }})</p>
                <p>City: {{ room.location.city }}</p>
            </article>
        {% empty %}
            <p>No rooms available.</p>
        {% endfor %}
    </main>
</body>
</html>
